patterns:
  - id: montant_eur
    regex: '\d[\d\s.,]*\s?(?:€|eur\b|euros?)'
    shape: amount
  - id: delai
    regex: '\b\d+\s?(?:jours?|mois|semaines?|ans?|heures?|days?|months?|weeks?|years?|tage|monate|wochen|dias?|meses)\b'
    shape: delay
  - id: pourcentage
    regex: '\d+(?:[.,]\d+)?\s?%'
    shape: amount
  - id: annee
    regex: '\b(?:19|20)\d{2}\b'
    shape: date
